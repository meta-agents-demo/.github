name: reusable secure-env proof

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: secure-env-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-env:
    name: SOPS + Nix + just
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Verify encrypted-environment contract
        run: nix develop --no-write-lock-file --command just env-ci
